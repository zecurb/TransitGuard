[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Nehemiah Boyce"]
repository = "https://github.com/zecurb/TransitGuard"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = {
    version = "0.9.0",
    default-features = false,
    features = [
        "runtime-tokio",
        "tls-rustls-ring-native-roots",
        "postgres",
        "json",
        "uuid",
        "migrate",
        "macros",
    ],
}
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
